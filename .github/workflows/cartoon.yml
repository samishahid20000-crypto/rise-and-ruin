name: Cartoon test
on:
  workflow_dispatch:
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install requests edge-tts pillow
      - run: python cartoon.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: cartoon-video
          path: build/video.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: cartoon-thumbnail
          path: build/thumbnail.jpg
